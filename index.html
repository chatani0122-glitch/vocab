<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英単語ノート</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--sub:#6b7385;--line:#e2e5ec;--accent:#3b6cf6;--ok:#1f9d5b;--ng:#d6453d}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1e222b;--text:#e8ebf2;--sub:#98a1b5;--line:#2e3441;--accent:#6c93ff;--ok:#4cc685;--ng:#ff7a72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;font-size:.95rem}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1}
button.btn{padding:9px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font:inherit}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--line)}
.word{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.word b{font-size:1.1rem}
.sub{color:var(--sub);font-size:.9rem}
.ex{color:var(--sub);font-style:italic;font-size:.9rem;margin-top:2px}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--sub);margin-left:6px;cursor:pointer;user-select:none}
.tag.done{color:var(--ok);border-color:var(--ok)}
.acts{display:flex;gap:6px;flex-shrink:0}
.acts button{padding:4px 8px;font-size:.8rem}
.flash{text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer}
.flash .big{font-size:2rem;font-weight:700}
.hidden{display:none}
.empty{text-align:center;color:var(--sub);padding:30px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--accent)}
.bars{display:flex;gap:6px;align-items:flex-end;height:80px;margin-top:6px}
.bars div{flex:1;text-align:center;font-size:.7rem;color:var(--sub);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;margin-bottom:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📘 英単語ノート</h1>
  <div class="tabs">
    <button data-t="list" class="on">単語帳</button>
    <button data-t="quiz">復習カード</button>
    <button data-t="log">学習記録</button>
  </div>

  <section id="list">
    <div class="card">
      <div class="row"><input id="w" placeholder="英単語 (例: ubiquitous)"><input id="m" placeholder="意味 (例: どこにでもある)"></div>
      <div class="row"><input id="e" placeholder="例文 (任意)"></div>
      <button class="btn" id="add">追加</button>
    </div>
    <div class="row">
      <input id="q" placeholder="🔍 検索">
      <select id="f"><option value="all">すべて</option><option value="learning">学習中</option><option value="done">覚えた</option></select>
    </div>
    <div id="items"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" id="exp">JSON書き出し</button>
      <button class="btn ghost" id="imp">JSON読み込み</button>
    </div>
    <input type="file" id="file" accept=".json" class="hidden">
    <details class="card" style="margin-top:14px">
      <summary>⚙️ AI例文の設定</summary>
      <div class="sub" style="margin:8px 0">Anthropic APIキーを入れると、単語登録時にAIが例文(日本語訳つき)を作ります。キーはこのブラウザ内にだけ保存され、Anthropic以外には送られません。未設定なら Tatoeba/辞書から取得します。</div>
      <div class="row"><input type="password" id="ak" placeholder="sk-ant-..." autocomplete="off"><button class="btn" id="aks" style="flex:0 0 auto">保存</button></div>
      <div class="sub" id="akm"></div>
    </details>
  </section>

  <section id="quiz" class="hidden">
    <div class="sub" id="prog" style="margin-bottom:8px"></div>
    <div class="card flash" id="fc"></div>
    <div class="row" id="qb" style="display:none">
      <button class="btn" style="background:var(--ng)" id="no">まだ</button>
      <button class="btn" style="background:var(--ok)" id="yes">覚えた</button>
    </div>
  </section>

  <section id="log" class="hidden">
    <div class="stats">
      <div class="stat"><b id="sStreak">0</b><span class="sub">連続日数</span></div>
      <div class="stat"><b id="sToday">0</b><span class="sub">今日(分)</span></div>
      <div class="stat"><b id="sWeek">0</b><span class="sub">今週(分)</span></div>
    </div>
    <div class="card">
      <div class="sub">直近7日間(分)</div>
      <div class="bars" id="bars"></div>
    </div>
    <div class="card">
      <div class="row"><input type="date" id="ld"><input type="number" id="lm" min="1" placeholder="時間(分)"></div>
      <div class="row">
        <select id="lc"><option>単語</option><option>文法</option><option>リスニング</option><option>リーディング</option><option>スピーキング</option><option>ライティング</option><option>その他</option></select>
        <input id="ln" placeholder="メモ (任意)">
      </div>
      <button class="btn" id="ladd">記録する</button>
    </div>
    <div id="logs"></div>
  </section>
</div>

<script>
const KEY="vocab-v1";
let words=[];
try{words=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(words))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let editId=null;
const loading=new Set(), failed=new Set();

// 例文の自動取得: オープンソース/オープンデータから取得
//  1) Free Dictionary API (オープンソース辞書)  2) Tatoeba (CC BY 2.0 FR の例文コーパス、日本語訳つき)
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const wordRe=w=>new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i");
async function fromDictionary(w){
  const r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w.toLowerCase()));
  if(!r.ok)throw 0;
  const all=[];
  for(const entry of await r.json())for(const mn of entry.meanings||[])for(const d of mn.definitions||[])if(d.example)all.push(d.example.trim());
  if(!all.length)throw 0;
  const re=wordRe(w);
  return {e:cap(all.filter(s=>re.test(s)).sort((a,b)=>a.length-b.length)[0]||all[0]),src:"Free Dictionary API"};
}
async function fromTatoeba(w){
  const u="https://tatoeba.org/en/api_v0/search?from=eng&to=jpn&trans_filter=limit&query="+encodeURIComponent(w)+"&sort=relevance";
  const r=await fetch(u);
  if(!r.ok)throw 0;
  const re=wordRe(w);
  const hits=((await r.json()).results||[]).filter(x=>x.text&&re.test(x.text)&&x.text.length<=120)
    .sort((a,b)=>a.text.length-b.text.length);
  if(!hits.length)throw 0;
  const h=hits[0], tr=[].concat(...(h.translations||[])).find(t=>t&&t.lang==="jpn");
  return {e:h.text,j:tr?tr.text:"",src:"Tatoeba (CC BY 2.0 FR)"};
}
const AKEY="vocab-ai-key";
const getKey=()=>{try{return localStorage.getItem(AKEY)||""}catch(e){return ""}};
async function fromAI(w,m){
  const key=getKey();if(!key)throw 0;
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
    "content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01",
    "anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:300,messages:[{role:"user",content:
`英単語「${w}」(意味: ${m})を使った、自然で覚えやすい英語の例文を1つ作ってください。語学学習者向けに、15語以内の平易な文で、この単語が意味の通りに使われること。次のJSONのみを出力: {"e":"英文","j":"日本語訳"}`}]})});
  if(!r.ok)throw 0;
  const t=(await r.json()).content.map(c=>c.text||"").join("");
  const o=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));
  if(!o.e||!wordRe(w).test(o.e))throw 0;
  return {e:String(o.e),j:String(o.j||""),src:"AI生成 (Claude)"};
}
async function fetchExample(x){
  loading.add(x.id);failed.delete(x.id);render();
  let got=null;
  for(const f of [fromAI,fromTatoeba,fromDictionary]){
    try{got=await f(x.w,x.m);break}catch(e){}
  }
  if(got){x.e=got.e;x.j=got.j||"";x.src=got.src;save()}else failed.add(x.id);
  loading.delete(x.id);render();
}
// 例文のない既存の単語は、開いたときに順番に自動取得する
(async()=>{for(const x of words.filter(x=>!x.e&&!failed.has(x.id)))await fetchExample(x)})();

function render(){
  const q=$("#q").value.trim().toLowerCase(), f=$("#f").value;
  const rows=words.filter(x=>(f==="all"||(f==="done")===x.done)&&(!q||(x.w+x.m+x.e).toLowerCase().includes(q)));
  $("#items").innerHTML=rows.length?rows.map(x=>`
    <div class="card"><div class="word"><div>
      <b>${esc(x.w)}</b><span class="tag ${x.done?"done":""}" data-tg="${x.id}">${x.done?"覚えた":"学習中"}</span>
      <div>${esc(x.m)}</div>${x.e?`<div class="ex">${esc(x.e)}</div>${x.j?`<div class="sub">${esc(x.j)}</div>`:""}${x.src?`<div class="sub" style="font-size:.7rem">出典: ${esc(x.src)}</div>`:""}`:loading.has(x.id)?`<div class="ex">例文を取得中…</div>`:`<div class="ex"><a href="#" data-ex="${x.id}">${failed.has(x.id)?"例文が見つかりませんでした。もう一度試す":"例文を自動取得"}</a></div>`}
    </div><div class="acts">
      <button class="btn ghost" data-sp="${x.id}">🔊</button>
      <button class="btn ghost" data-ed="${x.id}">編集</button>
      <button class="btn ghost" data-rm="${x.id}">削除</button>
    </div></div></div>`).join(""):`<div class="empty">単語がありません</div>`;
}

$("#add").onclick=()=>{
  const w=$("#w").value.trim(), m=$("#m").value.trim(), e=$("#e").value.trim();
  if(!w||!m){return}
  if(editId){Object.assign(words.find(x=>x.id===editId),{w,m,e});editId=null;$("#add").textContent="追加"}
  else{
    const nw={id:Date.now()+Math.random(),w,m,e,done:false};
    words.unshift(nw);
    if(!e)setTimeout(()=>fetchExample(nw),0);
  }
  ["#w","#m","#e"].forEach(s=>$(s).value="");
  save();render();
};
$("#items").onclick=ev=>{
  const t=ev.target, g=a=>words.find(x=>String(x.id)===t.dataset[a]);
  if(t.dataset.ex){ev.preventDefault();fetchExample(g("ex"));return}
  if(t.dataset.tg){const x=g("tg");x.done=!x.done}
  else if(t.dataset.rm){const x=g("rm");if(!confirm(`「${x.w}」を削除しますか？`))return;words=words.filter(y=>y!==x)}
  else if(t.dataset.ed){const x=g("ed");editId=x.id;$("#w").value=x.w;$("#m").value=x.m;$("#e").value=x.e;$("#add").textContent="更新";scrollTo(0,0);return}
  else if(t.dataset.sp){speak(g("sp").w);return}
  else return;
  save();render();
};
$("#q").oninput=$("#f").onchange=render;

// 発音: アメリカ英語(en-US)の音声を明示的に選ぶ
const US_PREF=[/natural.*(aria|jenny|guy|ana)/i,/google us english/i,/samantha/i,/aria|jenny|guy/i,/zira|david|mark/i];
function usVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US$/i.test(v.lang));
  for(const re of US_PREF){const v=vs.find(v=>re.test(v.name));if(v)return v}
  return vs[0]||null;
}
function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";u.rate=.9;
  const v=usVoice();if(v)u.voice=v;
  speechSynthesis.speak(u);
}
if("speechSynthesis" in window)speechSynthesis.getVoices();

// APIキー設定
$("#ak").value=getKey();
$("#akm").textContent=getKey()?"設定済み: AI例文が有効です":"";
$("#aks").onclick=()=>{
  const k=$("#ak").value.trim();
  try{k?localStorage.setItem(AKEY,k):localStorage.removeItem(AKEY)}catch(e){}
  $("#akm").textContent=k?"保存しました: AI例文が有効です":"キーを削除しました";
};

// export / import
$("#exp").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(words,null,2)],{type:"application/json"}));
  a.download="vocab.json";a.click();
};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async ev=>{
  try{
    const d=JSON.parse(await ev.target.files[0].text());
    if(!Array.isArray(d))throw 0;
    const have=new Set(words.map(x=>x.w.toLowerCase()));
    d.filter(x=>x&&x.w&&x.m&&!have.has(String(x.w).toLowerCase()))
     .forEach(x=>words.push({id:Date.now()+Math.random(),w:String(x.w),m:String(x.m),e:String(x.e||""),done:!!x.done}));
    save();render();
  }catch(e){alert("読み込めませんでした")}
  ev.target.value="";
};

// tabs
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["list","quiz","log"].forEach(id=>$("#"+id).classList.toggle("hidden",b.dataset.t!==id));
  if(b.dataset.t==="quiz")startQuiz();
  if(b.dataset.t==="log")renderLog();
});

// 学習記録
const LKEY="vocab-study-v1";
let logs=[];
try{logs=JSON.parse(localStorage.getItem(LKEY))||[]}catch(e){}
const saveLogs=()=>{try{localStorage.setItem(LKEY,JSON.stringify(logs))}catch(e){}};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
function minutesOn(day){return logs.filter(l=>l.d===day).reduce((a,l)=>a+l.min,0)}
function renderLog(){
  const today=new Date(), t=ymd(today);
  // 連続日数: 今日未記録でも昨日まで続いていれば継続中とみなす
  let streak=0, d=minutesOn(t)?today:addDays(today,-1);
  while(minutesOn(ymd(d))){streak++;d=addDays(d,-1)}
  const mon=addDays(today,-((today.getDay()+6)%7)); // 週の始まりは月曜
  let week=0;for(let i=0;i<7;i++)week+=minutesOn(ymd(addDays(mon,i)));
  $("#sStreak").textContent=streak;$("#sToday").textContent=minutesOn(t);$("#sWeek").textContent=week;
  const days=[...Array(7)].map((_,i)=>addDays(today,i-6));
  const vals=days.map(x=>minutesOn(ymd(x))), max=Math.max(30,...vals);
  $("#bars").innerHTML=days.map((x,i)=>`<div><span>${vals[i]||""}</span><i style="height:${vals[i]/max*60}px"></i>${x.getMonth()+1}/${x.getDate()}</div>`).join("");
  const rows=[...logs].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  $("#logs").innerHTML=rows.length?rows.map(l=>`
    <div class="card"><div class="word"><div>
      <b>${esc(l.d)}</b><span class="tag">${esc(l.c)}</span> ${l.min}分
      ${l.n?`<div class="sub">${esc(l.n)}</div>`:""}
    </div><div class="acts"><button class="btn ghost" data-lrm="${l.id}">削除</button></div></div></div>`).join(""):`<div class="empty">記録がありません</div>`;
}
$("#ld").value=ymd(new Date());
$("#ladd").onclick=()=>{
  const d=$("#ld").value, min=parseInt($("#lm").value,10);
  if(!d||!(min>0))return;
  logs.push({id:Date.now()+Math.random(),d,min,c:$("#lc").value,n:$("#ln").value.trim()});
  $("#lm").value="";$("#ln").value="";
  saveLogs();renderLog();
};
$("#logs").onclick=ev=>{
  const id=ev.target.dataset.lrm;if(!id)return;
  if(!confirm("この記録を削除しますか？"))return;
  logs=logs.filter(l=>String(l.id)!==id);saveLogs();renderLog();
};

// quiz
let deck=[],cur=null,shown=false;
function startQuiz(){
  deck=words.filter(x=>!x.done).sort(()=>Math.random()-.5);
  next();
}
function next(){
  cur=deck.shift();shown=false;
  $("#qb").style.display="none";
  if(!cur){$("#prog").textContent="";$("#fc").innerHTML=`<div class="empty">復習する単語がありません 🎉</div>`;return}
  $("#prog").textContent=`残り ${deck.length+1} 語`;
  $("#fc").innerHTML=`<div class="big">${esc(cur.w)}</div><div class="sub">タップして意味を表示</div>`;
}
$("#fc").onclick=()=>{
  if(!cur||shown)return;shown=true;
  $("#fc").innerHTML=`<div class="big">${esc(cur.w)}</div><div style="margin-top:8px">${esc(cur.m)}</div>${cur.e?`<div class="ex">${esc(cur.e)}</div>`:""}${cur.j?`<div class="sub">${esc(cur.j)}</div>`:""}`;
  $("#qb").style.display="flex";
};
$("#yes").onclick=()=>{cur.done=true;save();next()};
$("#no").onclick=()=>{deck.push(cur);next()};

render();
</script>
</body>
</html>
