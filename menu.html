<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冷蔵庫から献立</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--sub:#6b7385;--line:#e2e5ec;--accent:#e0742b;--accent-t:#fff;--ok:#1f9d5b;--ng:#d6453d}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1e222b;--text:#e8ebf2;--sub:#98a1b5;--line:#2e3441;--accent:#f0944f;--accent-t:#000;--ok:#4cc685;--ng:#ff7a72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0 12px}
h2{font-size:1rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1}
button{font:inherit;cursor:pointer}
.btn{padding:9px 14px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-t);font-weight:600}
.btn.big{width:100%;padding:13px;font-size:1.05rem;margin-top:4px}
.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.85rem}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:12px 0;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;font-size:1rem}
.seg button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:.9rem}
.chip.add{cursor:pointer;color:var(--sub)}
.chip.unk{border-style:dashed}
.chip .x{cursor:pointer;color:var(--sub);margin-left:2px}
.sub{color:var(--sub);font-size:.85rem}
.day{font-weight:700;margin:2px 0 8px}
.dish{padding:10px 0;border-top:1px solid var(--line)}
.dish:first-of-type{border-top:0}
.dish-h{display:flex;gap:8px;align-items:center}
.dish-h .name{flex:1;font-weight:600}
.type{font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--accent);color:var(--accent-t);font-weight:700}
.desc{font-size:.85rem;margin:2px 0 0}
.seas{font-size:.85rem;margin:8px 0 0;color:var(--sub)}
.seas b,.tip b{color:var(--text)}
.tip{font-size:.85rem;margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0}
.ing{font-size:.85rem;color:var(--sub);margin:4px 0 0}
.ing .have{color:var(--ok);font-weight:600}
.steps{font-size:.88rem;margin:6px 0 0;padding-left:1.3em}
details summary{cursor:pointer;color:var(--sub);font-size:.85rem;margin-top:4px}
.shop li{display:flex;gap:8px;padding:5px 0}
.shop ul{list-style:none;margin:0;padding:0}
.shop label{flex:1;display:flex;gap:8px;align-items:center}
.shop input{width:auto}
.shop .done{text-decoration:line-through;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:14px 0}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍳 冷蔵庫から献立</h1>

  <div class="card">
    <h2>① 何人分？</h2>
    <div class="seg" id="people"></div>
  </div>

  <div class="card">
    <h2>② 冷蔵庫にある食材</h2>
    <div class="row">
      <input id="inp" placeholder="例：ほうれん草、なす、豚肉" enterkeyhint="done">
      <button class="btn" id="addBtn">追加</button>
    </div>
    <div class="sub" style="margin-top:4px">「、」や「,」区切りでまとめて入力できます</div>
    <div class="chips" id="fridge"></div>
    <div class="sub" style="margin-top:10px">よく使う食材（タップで追加）</div>
    <div class="chips" id="quick"></div>
    <div class="sub" style="margin-top:10px">※ 調味料・油・だし・カレールウなどは常備している前提です</div>
  </div>

  <div class="card">
    <h2>③ 何日分の夕食？</h2>
    <div class="seg" id="days"></div>
    <button class="btn big" id="gen">献立をつくる</button>
  </div>

  <div id="out"></div>
</div>

<script>
// ===== 食材の正規化 =====
const kata2hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const norm = s => kata2hira(String(s).trim().toLowerCase().replace(/\s+/g, ''));

// 正式名 : 別名
const ALIAS = {
  '玉ねぎ':['たまねぎ','玉葱','オニオン'],
  'ねぎ':['長ねぎ','青ねぎ','白ねぎ','万能ねぎ','小ねぎ','長ネギ'],
  'ほうれん草':['ほうれんそう','ホウレンソウ'],
  '小松菜':['こまつな'],
  'キャベツ':['きゃべつ'],
  'にんじん':['人参','ニンジン'],
  'じゃがいも':['ジャガイモ','じゃが芋','ポテト'],
  '大根':['だいこん'],
  'なす':['茄子','ナス'],
  'ピーマン':['ぴーまん'],
  'トマト':['ミニトマト','プチトマト'],
  'きゅうり':['胡瓜','キュウリ'],
  'ブロッコリー':[],
  'かぼちゃ':['南瓜','カボチャ'],
  'ごぼう':['牛蒡'],
  'もやし':['モヤシ'],
  'しめじ':['ぶなしめじ','きのこ','キノコ','えのき','エノキ','まいたけ','しいたけ','椎茸'],
  'なめこ':[],
  'わかめ':['ワカメ','乾燥わかめ'],
  '豚肉':['豚こま','豚バラ','豚ロース','豚こま肉','豚薄切り','ぶた肉','ぶたにく','豚'],
  '鶏肉':['鶏もも','鶏むね','ささみ','とり肉','とりにく','手羽','鶏','鶏もも肉','鶏むね肉'],
  '牛肉':['牛こま','牛薄切り','ぎゅうにく','牛','牛バラ'],
  'ひき肉':['挽き肉','合いびき','合い挽き','豚ひき肉','鶏ひき肉','ミンチ','ひきにく','合挽き肉'],
  'ベーコン':[],
  '鮭':['サケ','さけ','生鮭','塩鮭','サーモン'],
  'さば':['サバ','鯖'],
  'ぶり':['ブリ','鰤'],
  'えび':['エビ','海老'],
  'ツナ缶':['ツナ','シーチキン'],
  '卵':['たまご','玉子','タマゴ','エッグ'],
  '豆腐':['とうふ','木綿豆腐','絹豆腐','絹ごし豆腐'],
  '油揚げ':['あぶらあげ','油あげ'],
  'うどん':['ウドン'],
  '白菜':['はくさい','ハクサイ'],
  'にら':['ニラ','韮'],
  'れんこん':['蓮根','レンコン'],
  'さつまいも':['サツマイモ','さつま芋','薩摩芋'],
  'ごはん':['ご飯','米','白米','ライス']
};
const CANON = Object.keys(ALIAS);
const aliasMap = new Map();
CANON.forEach(c => { aliasMap.set(norm(c), c); ALIAS[c].forEach(a => aliasMap.set(norm(a), c)); });
function resolve(raw){
  const n = norm(raw);
  if (!n) return null;
  if (aliasMap.has(n)) return {name: aliasMap.get(n), known: true};
  if (n.length >= 3) {
    for (const [k, c] of aliasMap) if (k.length >= 3 && (n.includes(k) || k.includes(n))) return {name: c, known: true};
  }
  return {name: raw.trim(), known: false};
}

// ===== レシピ =====
// [種別, 名前, 調理分, ひとこと, [[食材,1人分,単位]], [[調味料,1人分(小さじ換算 or 単位),'tsp'|単位]], [手順], コツ]
const R = [
 // ---------- 主菜 ----------

  [['しょうゆ',2.25,'tsp'],['みりん',2.25,'tsp'],['酒',1.5,'tsp'],['おろし生姜',1.5,'tsp'],['片栗粉',0.5,'tsp'],['サラダ油',1,'tsp']],

  ['鶏肉は厚い部分に切り込みを入れて厚みを均一にし、塩こしょうをふる。皮にフォークで数カ所穴をあける','しょうゆ・みりん・酒・砂糖を混ぜておく。ねぎは4cm長さに切る','冷たいフライパンに鶏肉を皮目を下にして入れ、中火で7〜8分、ふたをせずにじっくり焼く','皮がきつね色になったら返し、ねぎを加えて2分焼く。出た脂はキッチンペーパーで拭き取る','合わせ調味料を加え、煮汁にとろみが出るまで鶏肉を返しながら絡める。食べやすく切って盛る'],

  [['牛肉',70,'g'],['じゃがいも',1,'個'],['玉ねぎ',0.5,'個'],['にんじん',0.3,'本']],
  [['しょうゆ',3,'tsp'],['みりん',3,'tsp'],['砂糖',1.5,'tsp'],['酒',3,'tsp'],['水（またはだし）',150,'ml'],['サラダ油',1,'tsp']],
  ['じゃがいもは一口大、にんじんは乱切り、玉ねぎはくし切りにする。じゃがいもは水にさらす','鍋に油を熱し、牛肉を炒める。色が変わったらにんじん、じゃがいも、玉ねぎの順に加えて炒める','水・酒・砂糖・みりんを入れて沸騰したらアクを取り、落とし蓋をして中火で10分煮る','しょうゆを加え、さらに10分ほど、煮汁が少なくなるまで煮る。火を止めて10分置く'],
  '砂糖→みりん→しょうゆの順に入れると味がしっかりしみ込みます。煮崩れが心配なら、しょうゆは最後に。'],

  [['豆腐',0.5,'丁'],['ひき肉',60,'g'],['ねぎ',0.2,'本']],
  [['豆板醤',0.5,'tsp'],['味噌',1,'tsp'],['しょうゆ',1,'tsp'],['酒',1.5,'tsp'],['鶏ガラスープの素',0.5,'tsp'],['水',75,'ml'],['片栗粉',1,'tsp'],['おろしにんにく',0.5,'tsp'],['ごま油',1,'tsp']],
  ['豆腐はキッチンペーパーで包み、レンジで1〜2分加熱して水切りし、2cm角に切る。ねぎはみじん切りにする','フライパンにごま油、にんにく、豆板醤を入れて弱火で香りを出し、ひき肉を加えてポロポロになるまで炒める','水・酒・味噌・しょうゆ・鶏ガラを加えて煮立て、豆腐を入れて2〜3分煮る','火を弱めて水溶き片栗粉を回し入れ、とろみがついたらねぎを加えてひと混ぜする'],
  '豆腐は水切りしてから入れると水っぽくならず、味がぼやけません。'],
 ['主菜','ふっくらジューシー！煮込まない和風おろしハンバーグ',30,'パン粉と牛乳でふんわり。肉汁たっぷり。',
  [['ひき肉',120,'g'],['玉ねぎ',0.25,'個'],['卵',0.25,'個']],
  [['パン粉',3,'tsp'],['牛乳',3,'tsp'],['塩','少々','少々'],['こしょう・ナツメグ','少々','少々'],['ケチャップ',3,'tsp'],['ウスターソース',1.5,'tsp'],['酒',3,'tsp'],['サラダ油',1,'tsp']],
  ['玉ねぎをみじん切りにして、レンジで1分加熱して冷ます。パン粉は牛乳に浸す','ボウルにひき肉と塩を入れ、白っぽく粘りが出るまでよく練る。玉ねぎ、卵、パン粉、こしょう、ナツメグを加えて混ぜる','成形して中央をくぼませ、油を熱したフライパンの中火で2分焼く。焼き色がついたら返す','酒（大さじ程度）を入れてふたをし、弱火で6〜7分蒸し焼きにする。竹串を刺して透明な肉汁が出れば完成','取り出した後のフライパンにケチャップ・ソースを入れて煮詰め、ハンバーグにかける'],
  '最初に肉と塩だけを練ると、粘りが出てジューシーに焼き上がります。肉は冷たいうちに手早く。'],
 ['主菜','鮭のきのこバターしょうゆ',15,'小麦粉をまぶしてしっとり。きのこの旨みたっぷり。',
  [['鮭',1,'切れ'],['しめじ',0.3,'パック']],
  [['バター',2,'tsp'],['しょうゆ',1,'tsp'],['酒',1,'tsp'],['小麦粉',0.5,'tsp'],['塩こしょう','少々','少々'],['サラダ油',1,'tsp']],
  ['鮭は水気を拭いて塩こしょうをふり、小麦粉を薄くまぶす。しめじはほぐしておく','フライパンに油を熱し、鮭を中火で両面各3分焼いて取り出す','同じフライパンにバターとしめじを入れて炒め、酒としょうゆを加えてさっと煮絡める','鮭にきのこバターをのせる'],
  '鮭は焼く前にキッチンペーパーで水気をしっかり拭くと、臭みが出ずパリッと焼けます。'],
 ['主菜','臭みなし！とろとろ さばの味噌煮',20,'生姜と下ゆでで、ご飯に合う濃いめの味噌煮に。',
  [['さば',1,'切れ'],['ねぎ',0.2,'本']],
  [['味噌',3,'tsp'],['砂糖',1.5,'tsp'],['みりん',1.5,'tsp'],['酒',4.5,'tsp'],['水',50,'ml'],['生姜（薄切り）',0.5,'かけ']],
  ['さばは皮に十字の切り込みを入れる。熱湯をかけ、水気を拭く（臭み取り）','小さめのフライパンに水・酒・砂糖・みりん・生姜を入れて煮立てる','さばを皮目を上にして入れ、落とし蓋をして中火で8分煮る。途中で煮汁をかける','味噌を煮汁で溶いて加え、とろみがつくまで煮絡める。ねぎを添える'],

  ['キャベツはざく切り、にんじんは短冊切りにする。豚肉に塩こしょうをふる','フライパンを強火で熱してごま油をひき、豚肉を炒める。色が変わったらにんじん、キャベツ、もやしの順に加える','全体に油が回ったら、鶏ガラ・酒・しょうゆを加えて強火で30秒炒める'],

  [['鶏肉',120,'g'],['トマト',1,'個'],['玉ねぎ',0.3,'個']],
  [['コンソメ',0.8,'tsp'],['塩こしょう','少々','少々'],['オリーブ油',1,'tsp'],['水',50,'ml'],['ケチャップ',1.5,'tsp']],

  'トマトは皮ごとでOK。煮崩れてソースになります。ケチャップを少し足すとコクが出ます。'],
 ['主菜','ご飯が進む！なすと豚肉の甘辛味噌炒め',15,'なすは油を吸わせすぎないのがコツ。',

const COUNT_UNITS = new Set(['個','本','枚','切れ','尾','杯','玉(1)']);
const TYPES = ['主菜','副菜','汁物'];

// ===== 状態 =====
const KEY = 'menu-app-v1';
let S = {people: 2, days: 3, fridge: [], plan: null, checked: {}};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ===== 数量表示 =====
const FR = {0:'',0.25:'¼',0.5:'½',0.75:'¾'};
function fr(r){ const w = Math.floor(r); return (w || r === 0 ? w : '') + FR[r - w]; }
function fmtSeas(x, p){
  if (typeof x.q === 'string') return x.q;
  if (x.u === 'tsp') {
    const t = x.q * p;
    if (t >= 3) return '大さじ' + fr(Math.round(t / 3 * 4) / 4);
    return '小さじ' + fr(Math.max(0.25, Math.round(t * 4) / 4));
  }
  if (x.u === 'ml') return Math.max(10, Math.round(x.q * p / 10) * 10) + 'ml';
  if (x.u === 'g') return Math.max(5, Math.round(x.q * p / 5) * 5) + 'g';
  return fr(Math.max(0.25, Math.round(x.q * p * 4) / 4)) + x.u;
}
function fmtQty(q, u){
  if (u === 'g') return Math.max(10, Math.round(q / 10) * 10) + 'g';
  if (COUNT_UNITS.has(u) || u === '尾') return Math.max(1, Math.ceil(q - 0.01)) + u;
  return fr(Math.max(0.25, Math.round(q * 4) / 4)) + u;
}

// ===== 献立生成 =====
const fridgeSet = () => new Set(S.fridge.map(x => resolve(x).name));

function score(rec, have, used){
  let hit = 0, miss = 0, pen = 0;
  rec.ings.forEach(i => {
    if (have.has(i.n)) { hit++; if ((used[i.n] || 0) >= 2) pen += 2.5; }
    else miss++;
  });
  return hit * 3 - miss * 0.7 - pen + Math.random() * 2;
}

function pick(type, have, used, exclude){
  const cands = R.filter(r => r.type === type && !exclude.has(r.id));
  if (!cands.length) return null;
  return cands.map(r => [score(r, have, used), r]).sort((a, b) => b[0] - a[0])[0][1];
}

function noteUse(rec, used, d = 1){
  rec.ings.forEach(i => used[i.n] = (used[i.n] || 0) + d);
}

function generate(){
  const have = fridgeSet(), used = {}, exclude = new Set(), plan = [];
  for (let d = 0; d < S.days; d++) {
    const day = [];
    TYPES.forEach(t => {
      const r = pick(t, have, used, exclude);
      if (r) { exclude.add(r.id); noteUse(r, used); day.push(r.id); }
    });
    plan.push(day);
  }
  S.plan = plan; S.checked = {}; save(); render();
}

function swap(d, k){
  const cur = S.plan[d][k];
  const rec = R[cur];
  const have = fridgeSet(), used = {}, exclude = new Set();
  S.plan.forEach((day, di) => day.forEach((id, ki) => { exclude.add(id); if (!(di === d && ki === k)) noteUse(R[id], used); }));
  const next = pick(rec.type, have, used, exclude);
  if (!next) { alert('この種別の他のレシピがもうありません'); return; }
  S.plan[d][k] = next.id; S.checked = {}; save(); render();
}

// ===== 描画 =====
function renderSettings(){
  $('people').innerHTML = [1,2,3,4].map(n => `<button data-p="${n}" class="${S.people===n?'on':''}">${n}人</button>`).join('');
  $('days').innerHTML = [1,3,5,7].map(n => `<button data-d="${n}" class="${S.days===n?'on':''}">${n}日分</button>`).join('');
  $('fridge').innerHTML = S.fridge.length
    ? S.fridge.map((x, i) => `<span class="chip ${resolve(x).known?'':'unk'}">${esc(x)}<span class="x" data-rm="${i}">✕</span></span>`).join('')
    : '<span class="sub">まだ何も入っていません</span>';
  const quick = ['ほうれん草','玉ねぎ','じゃがいも','にんじん','キャベツ','なす','ピーマン','トマト','もやし','ねぎ','豚肉','鶏肉','ひき肉','鮭','卵','豆腐'];
  const mine = new Set(S.fridge.map(x => resolve(x).name));
  $('quick').innerHTML = quick.filter(q => !mine.has(q)).map(q => `<span class="chip add" data-q="${q}">＋${q}</span>`).join('');
}

function renderPlan(){
  const out = $('out');
  if (!S.plan) { out.innerHTML = ''; return; }
  const have = fridgeSet(), p = S.people;
  const wk = '日月火水木金土';
  const shop = {}, useFromFridge = new Set();
  let html = '';
  S.plan.forEach((day, d) => {
    const dt = new Date(); dt.setDate(dt.getDate() + d);
    const label = (d === 0 ? '今日' : d === 1 ? '明日' : `${d + 1}日目`) + `（${dt.getMonth()+1}/${dt.getDate()} ${wk[dt.getDay()]}）`;
    html += `<div class="card"><div class="day">${label}の夕食</div>`;
    day.forEach((id, k) => {
      const r = R[id];
      const ings = r.ings.map(i => {
        const q = fmtQty(i.q * p, i.u), has = have.has(i.n);
        if (has) useFromFridge.add(i.n);
        else { const key = i.n + '|' + i.u; (shop[key] = shop[key] || {n:i.n, u:i.u, q:0}).q += i.q * p; }
        return has ? `<span class="have">${esc(i.n)} ${q}</span>` : `${esc(i.n)} ${q}`;
      }).join('、');
      html += `<div class="dish"><div class="dish-h"><span class="type">${r.type}</span><span class="name">${esc(r.name)}</span><span class="sub">${r.min}分</span><button class="ghost" data-swap="${d},${k}">替える</button></div>
        <div class="desc">${esc(r.desc)}</div>
        <div class="ing">${ings}</div>
        <details><summary>作り方を見る</summary>
          <div class="seas"><b>調味料</b>　${r.seas.map(x => esc(x.n) + ' ' + esc(fmtSeas(x, p))).join('、')}</div>
          <ol class="steps">${r.steps.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
          <div class="tip"><b>コツ</b>　${esc(r.tip)}</div></details></div>`;
    });
    html += '</div>';
  });

  const list = Object.values(shop).sort((a, b) => a.n.localeCompare(b.n, 'ja'));
  html += `<div class="card shop"><h2>🛒 買い足すもの（${p}人分）</h2>`;
  html += list.length ? '<ul>' + list.map(x => {
    const key = x.n + '|' + x.u, c = S.checked[key];
    return `<li><label><input type="checkbox" data-chk="${esc(key)}" ${c?'checked':''}><span class="${c?'done':''}">${esc(x.n)} ${fmtQty(x.q, x.u)}</span></label></li>`;
  }).join('') + '</ul>' : '<div class="empty">買い足すものはありません 🎉</div>';
  if (useFromFridge.size) html += `<div class="sub" style="margin-top:8px">冷蔵庫から使う食材：${[...useFromFridge].map(esc).join('、')}</div>`;
  const unused = S.fridge.filter(x => { const r = resolve(x); return !useFromFridge.has(r.name); });
  if (unused.length) html += `<div class="sub" style="margin-top:4px">今回使わなかった食材：${unused.map(esc).join('、')}${unused.some(x => !resolve(x).known) ? '（点線の食材はレシピ未登録です）' : ''}</div>`;
  html += '</div>';
  out.innerHTML = html;
}

function render(){ renderSettings(); renderPlan(); }

// ===== イベント =====
function addItems(text){
  text.split(/[、,，\s\n]+/).map(s => s.trim()).filter(Boolean).forEach(s => {
    const r = resolve(s);
    if (!S.fridge.some(x => resolve(x).name === r.name)) S.fridge.push(r.known ? s : r.name);
  });
  save(); render();
}
$('addBtn').onclick = () => { addItems($('inp').value); $('inp').value = ''; $('inp').focus(); };
$('inp').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) $('addBtn').click(); });
$('gen').onclick = generate;
document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.p) { S.people = +t.dataset.p; save(); render(); }
  else if (t.dataset.d) { S.days = +t.dataset.d; save(); renderSettings(); }
  else if (t.dataset.rm) { S.fridge.splice(+t.dataset.rm, 1); save(); render(); }
  else if (t.dataset.q) addItems(t.dataset.q);
  else if (t.dataset.swap) { const [d, k] = t.dataset.swap.split(',').map(Number); swap(d, k); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.chk) { S.checked[e.target.dataset.chk] = e.target.checked; save(); renderPlan(); }
});
render();
</script>
